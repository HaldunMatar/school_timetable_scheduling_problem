name: Build Desktop App

# Builds a real double-clickable Windows .exe and macOS .app, with no
# Windows/Mac machine needed on your side - see BUILD.md for the full,
# no-terminal walkthrough. Runs automatically on every push, and can also
# be triggered manually from the Actions tab (Run workflow) with no new
# commit needed.
on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TeacherScheduler-Windows
            build_path: dist/TeacherScheduler.exe
          - os: macos-latest
            artifact_name: TeacherScheduler-macOS
            build_path: dist/TeacherScheduler.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # tkinter ships with Python itself, not with pip - this just confirms
      # the interpreter GitHub gave us actually has it working before
      # spending minutes on a PyInstaller build that would only fail later
      # with a much more confusing error.
      - name: Sanity-check tkinter is available
        run: python -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Build with PyInstaller
        run: pyinstaller app.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_path }}
          if-no-files-found: error
